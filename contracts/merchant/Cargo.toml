[package]
name = "deepfish-merchant-economy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
near-sdk = { version = "=5.17.2", features = ["legacy"] }
near-contract-standards = "=5.17.2"
near-sys = "=0.2.5"

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
